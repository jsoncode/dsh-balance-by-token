# 发布工作流：推送 v* tag 时触发
# - release job：安装依赖（pnpm frozen-lockfile）+ 类型检查（tsc -b）+ 构建（tsc -b && tsdown）
#   → 打包并直接创建 GitHub Release（非草稿）→ 自动通过带有 Bypass 2FA 权限的传统 Token 发布至 npm
name: Publish

on:
    push:
        tags:
            - 'v*'

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write   # 用于创建 GitHub Release
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 26
                  package-manager-cache: false

            - name: Install dependencies
              run: npx --yes pnpm@10.33.0 install --frozen-lockfile

            - name: Type check
              run: npx --yes pnpm@10.33.0 run check

            - name: Build
              run: npx --yes pnpm@10.33.0 run build

            - name: Verify bundle
              run: npx --yes pnpm@10.33.0 run verify

            - name: Pack tarball
              run: npx --yes pnpm@10.33.0 pack

            - name: Create GitHub Release (published, not draft)
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${{ github.ref_name }}" \
                    --title "${{ github.ref_name }}" \
                    --generate-notes \
                    --verify-tag \
                    *.tgz

            - name: Publish to npm via Token
                # 🌟 核心修复：1. 修正为官方标准发布源 2. 保留不进行本地 git 检查的参数
              run: npm publish --registry=https://registry.npmjs.org/ --no-git-checks
              env:
                  # 仅在这一行安全注入你在 GitHub Secrets 填写的、拥有 Bypass 2FA 权限的密匙
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
