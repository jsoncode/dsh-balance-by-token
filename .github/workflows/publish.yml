# 发布工作流：推送 v* tag 时触发
# - release job：安装依赖（pnpm frozen-lockfile）+ 类型检查（tsc -b）+ 构建（tsc -b && tsdown）
#   → 打包并直接创建 GitHub Release（非草稿）→ 自动通过带有 Bypass 2FA 权限的传统 Token 发布至 npm
name: Publish

on:
    push:
        tags:
            - 'v*'

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write   # 用于创建 GitHub Release
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 26
                  package-manager-cache: false
                  # 🌟 修改：指定官方源，setup-node 会自动将下方的 NODE_AUTH_TOKEN 注入到云端隐藏的 .npmrc 中
                  registry-url: 'https://npmjs.org'

            - name: Install dependencies
              run: npx --yes pnpm@10.33.0 install --frozen-lockfile

            - name: Type check
              run: npx --yes pnpm@10.33.0 run check

            - name: Build
              run: npx --yes pnpm@10.33.0 run build

            - name: Verify bundle
              run: npx --yes pnpm@10.33.0 run verify

            - name: Pack tarball
              run: npx --yes pnpm@10.33.0 pack

            - name: Create GitHub Release (published, not draft)
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${{ github.ref_name }}" \
                    --title "${{ github.ref_name }}" \
                    --generate-notes \
                    --verify-tag \
                    *.tgz

            - name: Publish to npm via Token
                # 🌟 修改：使用环境密码注入。注意：因为使用了传统 Token 认证，需移除旧代码中的 --provenance
              run: npm publish --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
